<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Flipkart Clone</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

<!-- ================= HEADER ================= -->
<header class="header">
  <div class="header-container">

    <!-- Logo -->
    <div class="logo">
      <a href="index.html">
        <img src="assets/images/logoname.png" alt="Flipkart">
      </a>
    </div>

    


  </div>

</header>

<!-- ================= LOGIN ================= -->
<main class="main">
  <div class="login-container">
     <!-- Banner -->
    <div class="login-banner">
      <img src="assets/images/banner.jpeg" alt="Banner">
    </div>

    <!-- Tab Navigation -->
    <div class="tab-container">
      <button class="tab-btn active" onclick="showLogin()">Login</button>
      <button class="tab-btn" onclick="showSignup()">Sign Up</button>
    </div>

    <!-- Login Form -->
    <div id="login-form" class="form-container">
      <h2>Login</h2>

      <div class="form-group">
        <input type="text" id="login-username" placeholder="Enter Username" required>
      </div>

      <div class="form-group">
        <input type="password" id="login-password" placeholder="Enter Password" required>
      </div>

      <button class="login-btn" onclick="login()">Login</button>
      <p id="login-error" class="error-message"></p>
    </div>

    <!-- Signup Form -->
    <div id="signup-form" class="form-container" style="display: none;">
      <h2>Sign Up</h2>

      <div class="form-group">
        <input type="text" id="signup-name" placeholder="Full Name" required>
      </div>

      <div class="form-group">
        <input type="email" id="signup-email" placeholder="Email Address" required>
      </div>

      <div class="form-group">
        <input type="text" id="signup-username" placeholder="Username" required>
      </div>

      <div class="form-group">
        <input type="password" id="signup-password" placeholder="Password (min 6 characters)" required>
      </div>

      <div class="form-group">
        <input type="password" id="signup-confirm-password" placeholder="Confirm Password" required>
      </div>

      <button class="signup-btn" onclick="signup()">Sign Up</button>
      <p id="signup-error" class="error-message"></p>
    </div>
  </div>
</main>

<!-- ================= FOOTER ================= -->
<footer class="footer">
  <div class="footer-container">
    <div>
      <h4>About</h4>
      <a href="#">Contact Us</a>
      <a href="#">About Us</a>
      <a href="#">Careers</a>
      <a href="#">Flipkart Stories</a>
    </div>

    <div>
      <h4>Help</h4>
      <a href="#">Payments</a>
      <a href="#">Shipping</a>
      <a href="#">Cancellation & Returns</a>
      <a href="#">FAQs</a>
    </div>

    <div>
      <h4>Policy</h4>
      <a href="#">Return Policy</a>
      <a href="#">Terms of Use</a>
      <a href="#">Security</a>
      <a href="#">Privacy</a>
    </div>
  </div>

  <p class="copyright">© 2025 Flipkart Clone</p>
</footer>

<script src="js/data.js"></script>
<script src="js/hamburger.js"></script>
<script src="js/user.js"></script>
<script src="js/login.js"></script>
</body>
</html>
