<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Details | Flipkart Clone</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-container">

    <!-- Logo -->
    <div class="logo">
      <a href="index.html">
        <img src="assets/images/logoname.png" alt="Flipkart">
      </a>
    </div>

   
    

    <!-- Cart -->
    <div class="cart">
      <a href="cart.html">
        <span class="material-icons">shopping_cart</span>
        <span class="cart-count">0</span>
      </a>
    </div>

    <!-- Address -->
    <div class="address-link">
      <span class="material-icons">location_on</span>
      <span>Address</span>
    </div>

    <!-- Login -->
    <div class="login-signup">
      <span class="material-icons">account_circle</span>
      <span>Login</span>
    </div>

 
    <!-- Overlay -->
    <div class="overlay" id="overlay"></div>

    <!-- Side Menu -->
    <div class="side-menu" id="sideMenu">
      <span class="material-icons close-btn" id="closeBtn">close</span>

      <h3>Categories</h3>
      <a href="html/mobileAndTablet.html" data-category="mobiles">Mobiles & Tablets</a>
      <a href="html/fashion.html" data-category="fashion">Fashion</a>
      <a href="html/tvAppliances.html" data-category="tv">TV & Appliances</a>
      <a href="html/homeAndFurniture.html" data-category="home">Home & Furniture</a>
      <a href="html/beautyProduct.html" data-category="beauty">Beauty</a>
      <a href="html/grocery.html" data-category="grocery">Grocery</a>
      <a href="html/sports.html" data-category="sports">Sports</a>
      <a href="html/electronic.html" data-category="electronic">Electronics</a>
      <a href="html/toys.html" data-category="toys">Toys</a>
      <a href="html/laptops.html" data-category="laptops">Laptops</a>
    </div>

  </div>

</header>

<!-- PRODUCT DETAILS -->
<section class="product-details">

  <div class="product-container">

    <!-- IMAGE -->
    <div class="product-image">
      <img id="productImage" alt="Product Image">
    </div>

    <!-- INFO -->
    <div class="product-info">
      <h1 id="productName"></h1>

      <div class="rating" id="productRating"></div>

      <div class="price" id="productPrice"></div>

      <p class="description" id="productDescription"></p>

      <!-- QUANTITY -->
      <div class="quantity-selector">
        <button id="qtyMinus">−</button>
        <span id="quantityValue">1</span>
        <button id="qtyPlus">+</button>
      </div>

      <!-- ADD TO CART -->
      <button id="addToCartBtn" class="add-to-cart">
        Add to Cart
      </button>

    </div>

  </div>

</section>

<!-- JS -->
<script src="js/data.js"></script>
<script src="js/user.js"></script>
<script src="js/hamburger.js"></script>
<script src="js/product.js"></script>

</body>
</html>
